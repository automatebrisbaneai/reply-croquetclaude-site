<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 9-step plan — your sign-off — CroquetClaude</title>
    <meta name="description" content="The 9 steps I'd take with your coaching list. Confirm or change each one.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 28V18a10 10 0 0120 0v10' fill='none' stroke='%232d6a4f' stroke-width='4' stroke-linecap='round'/></svg>">
    <link rel="stylesheet" href="/styles.css">
    <style>
    /* Mission-specific tweaks scoped to the approval page */
    .approval-card .card-body {
        font-size: 0.98rem;
        line-height: 1.6;
        color: var(--text-primary);
        margin-top: 0.7rem;
    }
    .approval-card .card-body p { margin: 0 0 0.7rem 0; }
    .approval-card .card-body ul { margin: 0.2rem 0 0.8rem 1.2rem; padding: 0; }
    .approval-card .card-body li { margin-bottom: 0.25rem; }
    .approval-card .card-body strong { color: var(--text-primary); }
    .approval-card .quoted-email {
        margin: 0.6rem 0 0.8rem 0;
        padding: 0.9rem 1.1rem;
        border-left: 3px solid var(--lawn);
        background: rgba(45, 106, 79, 0.05);
        font-family: Georgia, serif;
        font-size: 0.95rem;
        white-space: pre-wrap;
    }
    .approval-card .pill {
        display: inline-block;
        padding: 0.18rem 0.55rem;
        margin: 0 0.25rem 0.25rem 0;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 600;
        line-height: 1.3;
    }
    .approval-card .pill-current { background: rgba(45, 106, 79, 0.12); color: var(--lawn); }
    .approval-card .pill-overdue { background: rgba(184, 50, 39, 0.12); color: #b83227; }
    .approval-card .pill-nodate { background: rgba(188, 108, 37, 0.12); color: var(--terracotta); }
    .approval-card .presenter-row {
        padding: 0.4rem 0;
        border-bottom: 1px dashed rgba(0, 0, 0, 0.08);
        font-size: 0.93rem;
    }
    .approval-card .presenter-row:last-child { border-bottom: none; }
    .approval-card .presenter-row .name { font-weight: 600; }
    .approval-card .recommendation {
        margin-top: 0.7rem;
        padding: 0.7rem 0.9rem;
        background: rgba(45, 106, 79, 0.06);
        border-left: 2px solid var(--lawn);
        font-size: 0.95rem;
    }
    .approval-card .recommendation strong { color: var(--lawn); }
    .approval-card .warning {
        margin-top: 0.7rem;
        padding: 0.7rem 0.9rem;
        background: rgba(184, 50, 39, 0.06);
        border-left: 2px solid #b83227;
        font-size: 0.95rem;
    }
    .approval-card .warning strong { color: #b83227; }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="/" class="wordmark">
            <img src="/assets/drawn-claude.png" alt="" class="wordmark-avatar">
            <span>CroquetClaude</span>
        </a>
        <span class="mission-title">The 9-step plan</span>
    </header>

    <div id="app">
        <!-- Content injected by app.js + renderMission() -->
    </div>

    <script src="/app.js"></script>
    <script>
    // -----------------------------------------------------------------------
    // Mission — coaching-9-step-2026-05
    // -----------------------------------------------------------------------

    window.renderMission = function(tokenRecord) {
        const seed = tokenRecord.payload_seed;
        const respondentName = tokenRecord.respondent_name || 'there';
        const firstName = respondentName.split(' ')[0].split(',')[0];
        const draft = tokenRecord.draft_payload || null;
        const sections = (seed && seed.sections) || {};

        const sectionOrder = [
            { key: 'steps', heading: 'The plan — nine steps' }
        ];

        const approvalButtons = [
            { label: 'Looks right', value: 'confirm' },
            { label: 'Change this step', value: 'change' },
            { label: 'Unsure — let’s talk', value: 'unsure' }
        ];

        const cohortButtons = approvalButtons;

        const answers = {};

        function keyFor(section, idx) { return section + '/' + idx; }

        sectionOrder.forEach(function(s) {
            const items = sections[s.key] || [];
            items.forEach(function(_, i) {
                answers[keyFor(s.key, i)] = { answer: null, notes: '' };
            });
        });

        if (draft && Array.isArray(draft.cards)) {
            draft.cards.forEach(function(entry) {
                if (entry.key && answers.hasOwnProperty(entry.key)) {
                    answers[entry.key].answer = entry.answer !== undefined ? entry.answer : null;
                    answers[entry.key].notes = entry.notes || '';
                }
            });
        }

        let autosave = null;

        function buildPayload() {
            const cards = Object.keys(answers).map(function(k) {
                return { key: k, answer: answers[k].answer, notes: answers[k].notes || '' };
            });
            const gnTA = document.getElementById('general-notes');
            return { cards: cards, general_notes: gnTA ? gnTA.value : '' };
        }

        function updateValidationState() {
            return Object.keys(answers).filter(function(k) { return answers[k].answer === null; });
        }

        function buildApprovalCard(item, sectionKey, idx, buttonsConfig) {
            const k = keyFor(sectionKey, idx);
            const card = document.createElement('div');
            card.className = 'card approval-card';
            card.dataset.key = k;
            card.setAttribute('role', 'group');
            card.setAttribute('aria-label', item.title);

            const nameEl = document.createElement('div');
            nameEl.className = 'card-name';
            nameEl.textContent = item.title;
            card.appendChild(nameEl);

            if (item.subtitle) {
                const sub = document.createElement('div');
                sub.className = 'card-meta';
                const subSpan = document.createElement('span');
                subSpan.textContent = item.subtitle;
                sub.appendChild(subSpan);
                card.appendChild(sub);
            }

            if (item.body_html) {
                const body = document.createElement('div');
                body.className = 'card-body';
                body.innerHTML = item.body_html;
                card.appendChild(body);
            }

            const btnRow = document.createElement('div');
            btnRow.className = 'answer-buttons';

            const btns = item.buttons || buttonsConfig;

            btns.forEach(function(btn) {
                const b = document.createElement('button');
                b.className = 'btn-answer';
                b.textContent = btn.label;
                b.dataset.value = btn.value;
                b.setAttribute('type', 'button');

                if (btn.value === 'unsure' || btn.value === 'other') {
                    b.classList.add('unsure');
                }

                b.addEventListener('click', function() {
                    btnRow.querySelectorAll('.btn-answer').forEach(function(x) {
                        x.classList.remove('selected');
                    });
                    b.classList.add('selected');
                    answers[k].answer = btn.value;

                    const notesArea = card.querySelector('.notes-area');
                    if (notesArea) {
                        const showNotes = (btn.value !== 'confirm' && btn.value !== '73');
                        if (showNotes) {
                            notesArea.classList.add('visible');
                            notesArea.querySelector('textarea').focus();
                        } else {
                            notesArea.classList.remove('visible');
                        }
                    }

                    card.classList.add('answered');
                    card.classList.remove('missing');
                    updateValidationState();
                    if (autosave) autosave.save();
                });

                btnRow.appendChild(b);
            });

            card.appendChild(btnRow);

            const notesArea = document.createElement('div');
            notesArea.className = 'notes-area';
            const notesLabel = document.createElement('label');
            notesLabel.style.cssText = 'display:block;font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.3rem;';
            notesLabel.textContent = 'What would you change?';
            const notesTA = document.createElement('textarea');
            notesTA.placeholder = 'Tell me what’s off so I can rework this section…';
            notesTA.setAttribute('aria-label', 'Notes for ' + item.title);
            notesTA.addEventListener('input', function() {
                answers[k].notes = notesTA.value;
                if (autosave) autosave.save();
            });
            notesArea.appendChild(notesLabel);
            notesArea.appendChild(notesTA);
            card.appendChild(notesArea);

            return card;
        }

        const app = document.getElementById('app');
        const container = document.createElement('div');
        container.className = 'container';

        const opener = document.createElement('div');
        opener.className = 'opener';
        opener.innerHTML =
            '<p>Hi ' + firstName + ' — thank you for the updated coaching file. Below is the nine-step plan I’d run with it, once you’ve confirmed I’ve got the right shape.</p>' +
            '<p>Each step has three options: <em>Looks right</em>, <em>Change this step</em>, or <em>Unsure</em>. If you click anything other than <em>Looks right</em> there is a notes box for what you’d change. Once you press <em>Send my answers</em> I take whatever you’ve confirmed and start carrying it out.</p>' +
            '<p class="opener-note"><span class="opener-note-icon" aria-hidden="true">✎</span> Your answers save automatically. Close the tab and come back — the link picks up where you left off until you press <em>Send my answers</em>.</p>';
        container.appendChild(opener);

        sectionOrder.forEach(function(s) {
            const items = sections[s.key] || [];
            if (items.length === 0) return;

            const divider = document.createElement('hr');
            divider.className = 'section-divider';
            container.appendChild(divider);

            const heading = document.createElement('h2');
            heading.className = 'section-heading';
            heading.textContent = s.heading;
            container.appendChild(heading);

            const grid = document.createElement('div');
            grid.className = 'cards-grid';

            const defaultBtns = (s.key === 'cohort') ? cohortButtons : approvalButtons;

            items.forEach(function(item, i) {
                grid.appendChild(buildApprovalCard(item, s.key, i, defaultBtns));
            });
            container.appendChild(grid);
        });

        const divFinal = document.createElement('hr');
        divFinal.className = 'section-divider';
        container.appendChild(divFinal);

        const generalWrap = document.createElement('div');
        generalWrap.className = 'general-notes-wrap';
        const generalLabel = document.createElement('label');
        generalLabel.setAttribute('for', 'general-notes');
        generalLabel.textContent = 'Anything else I should know before I start sending?';
        generalWrap.appendChild(generalLabel);
        const generalTA = document.createElement('textarea');
        generalTA.id = 'general-notes';
        generalTA.placeholder = 'Optional — anything I’ve missed, anyone I shouldn’t contact, anything sensitive.';
        generalTA.addEventListener('input', function() {
            if (autosave) autosave.save();
        });
        generalWrap.appendChild(generalTA);
        container.appendChild(generalWrap);

        const validationError = document.createElement('div');
        validationError.className = 'validation-error';
        validationError.id = 'validation-error';
        container.appendChild(validationError);

        const submitWrap = document.createElement('div');
        submitWrap.className = 'submit-wrap';

        const draftSaved = document.createElement('span');
        draftSaved.id = 'draft-saved-indicator';
        draftSaved.className = 'draft-saved-indicator';
        draftSaved.textContent = '• Draft saved';
        submitWrap.appendChild(draftSaved);

        const submitBtn = document.createElement('button');
        submitBtn.id = 'submit-btn';
        submitBtn.className = 'btn-submit';
        submitBtn.setAttribute('type', 'button');
        submitBtn.textContent = 'Send my answers';

        const errorMsg = document.createElement('div');
        errorMsg.className = 'error-message';
        errorMsg.id = 'error-message';
        errorMsg.innerHTML = 'Something went wrong — please let us know at <a href="mailto:hello@croquetclaude.com">hello@croquetclaude.com</a>.';

        submitBtn.addEventListener('click', async function() {
            const unanswered = updateValidationState();

            document.querySelectorAll('.card').forEach(function(card) {
                const k = card.dataset.key;
                if (k && answers[k] && answers[k].answer === null) {
                    card.classList.add('missing');
                } else {
                    card.classList.remove('missing');
                }
            });

            if (unanswered.length > 0) {
                const ve = document.getElementById('validation-error');
                ve.textContent = unanswered.length === 1
                    ? 'One question still needs an answer — it’s highlighted above.'
                    : unanswered.length + ' questions still need answers — they’re highlighted above.';
                ve.classList.add('visible');
                const firstMissing = document.querySelector('.card.missing');
                if (firstMissing) {
                    firstMissing.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            const ve = document.getElementById('validation-error');
            ve.classList.remove('visible');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Sending…';

            const responsePayload = {
                cards: Object.keys(answers).map(function(k) {
                    return { key: k, answer: answers[k].answer, notes: answers[k].notes || '' };
                }),
                general_notes: generalTA.value
            };

            const ok = await window.submitMission(tokenRecord, responsePayload, respondentName);

            if (!ok) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send my answers';
                const em = document.getElementById('error-message');
                em.classList.add('visible');
            }
        });

        submitWrap.appendChild(submitBtn);
        submitWrap.appendChild(errorMsg);
        container.appendChild(submitWrap);

        app.innerHTML = '';
        app.appendChild(container);

        autosave = window.createAutosave(tokenRecord, buildPayload);

        if (draft && Array.isArray(draft.cards)) {
            draft.cards.forEach(function(entry) {
                if (!entry.key || entry.answer === null || entry.answer === undefined) return;
                const card = container.querySelector('[data-key="' + entry.key + '"]');
                if (!card) return;
                const btnRow = card.querySelector('.answer-buttons');
                if (btnRow) {
                    const btn = btnRow.querySelector('[data-value="' + entry.answer + '"]');
                    if (btn) {
                        btn.classList.add('selected');
                        card.classList.add('answered');
                    }
                }
                if (entry.notes) {
                    const notesArea = card.querySelector('.notes-area');
                    const notesTA = notesArea && notesArea.querySelector('textarea');
                    if (notesTA) {
                        notesTA.value = entry.notes;
                        if (entry.answer !== 'confirm' && entry.answer !== '73') {
                            notesArea.classList.add('visible');
                        }
                    }
                }
            });
            if (draft.general_notes && generalTA) {
                generalTA.value = draft.general_notes;
            }
            window.showDraftRestoredNotice(container, tokenRecord.updated);
        }
    };

    document.addEventListener('DOMContentLoaded', function() {
        window.initMission();
    });
    </script>
</body>
</html>
