<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coaching & refereeing register — CroquetClaude</title>
    <meta name="description" content="A few quick questions to shape the coaching and refereeing register.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 28V18a10 10 0 0120 0v10' fill='none' stroke='%232d6a4f' stroke-width='4' stroke-linecap='round'/></svg>">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="site-header">
        <a href="/" class="wordmark">
            <img src="/assets/drawn-claude.png" alt="" class="wordmark-avatar">
            <span>CroquetClaude</span>
        </a>
        <span class="mission-title">Coaching &amp; refereeing register</span>
    </header>

    <div id="app" class="mission-coaching-register">
        <!-- Content injected by app.js + renderMission() -->
    </div>

    <script src="/app.js"></script>
    <script>
    // -----------------------------------------------------------------------
    // Mission — coaching-referee-register-2026-08
    // A survey-shaped mission (not per-record cards): each question is its
    // own card, single-select / multi-select / free-text, plus a persistent
    // "Additional words" box per ask-wade convention (never a fallback-only
    // field — a pick and a note both count).
    // -----------------------------------------------------------------------

    const QUESTIONS = [
        {
            id: 'structure',
            type: 'single',
            q: 'Should coaching and refereeing share one register, or be split into two?',
            why: 'This decides almost everything else that follows — who can see what, who manages it, how reports are grouped. Best to settle it first.',
            options: [
                { value: 'combined', label: 'One register for both', sub: 'Coaching and refereeing side by side, each record marked which one it is. Less admin to keep updated.' },
                { value: 'separate', label: 'Two separate registers', sub: "Coaching and refereeing kept fully apart from day one — different people manage each without needing access to the other." },
                { value: 'combined-then-split', label: 'Start combined, split later if needed', sub: "Get something working now; revisit if managing them together turns out to be awkward." }
            ],
            notesPlaceholder: 'Any context that would help…'
        },
        {
            id: 'who_administers',
            type: 'single',
            q: 'Who should be able to add or change a coaching or refereeing record?',
            why: "We can't switch anything on until this is settled.",
            options: [
                { value: 'marilyn_both', label: 'You, for both golf codes', sub: 'One person, one place — simplest to start.' },
                { value: 'coordinator_per_code', label: "Each code's coordinator manages their own", sub: 'Coaching coordinator handles coaching, refereeing coordinator handles refereeing.' },
                { value: 'any_caq_admin', label: 'Any CAQ admin', sub: 'Wider group can help keep it current, but less control over who touches it.' },
                { value: 'named_group', label: "A specific small group", sub: "Tell us who, in Additional words." }
            ],
            notesPlaceholder: 'Any context that would help…'
        },
        {
            id: 'self_update',
            type: 'single',
            q: 'Can a coach or referee update their own record?',
            why: "You've asked before for coaches to self-update — this pins down exactly how much control they'd have.",
            options: [
                { value: 'coordinator_only', label: 'No — coordinator only', sub: 'Coaches and referees can see their own record but not change it.' },
                { value: 'self_then_approve', label: 'They request a change, coordinator approves it', sub: 'Keeps you in control while taking the typing off your plate.' },
                { value: 'self_direct', label: 'They can update it directly, no approval needed', sub: 'Fastest, but relies on people entering things correctly.' },
                { value: 'contact_only', label: 'Only their own contact details — never the accreditation itself', sub: 'Address, phone, email theirs to fix; qualifications stay coordinator-only.' }
            ],
            notesPlaceholder: 'Any context that would help…'
        },
        {
            id: 'accreditation_types',
            type: 'multi',
            q: 'What types of accreditation should be on the register from day one?',
            why: "Tell us everything you currently track so we don't miss something.",
            options: [
                { value: 'gc_coach', label: 'GC Coach levels' },
                { value: 'ac_coach', label: 'AC Coach levels' },
                { value: 'gc_referee', label: 'GC Referee' },
                { value: 'ac_referee', label: 'AC Referee' },
                { value: 'blue_card', label: 'Blue Card / Working with Children' },
                { value: 'first_aid', label: 'First Aid' }
            ],
            notesPlaceholder: 'Anything we’ve missed?'
        },
        {
            id: 'expiry_shape',
            type: 'single',
            q: "Should each accreditation carry a firm expiry date, or a 'refresher due' reminder?",
            why: 'This changes what the register does once time passes — cuts someone off automatically, or just flags that it\'s time to check in.',
            options: [
                { value: 'hard_expiry', label: 'A firm expiry date', sub: "On that date it's no longer current, full stop." },
                { value: 'refresher_due', label: 'A refresher reminder every so often', sub: 'Stays current, just flags that it\'s time to check in.' },
                { value: 'depends', label: 'Depends on the type', sub: 'Tell us which is which in Additional words.' }
            ],
            notesPlaceholder: 'e.g. GC Coach every 3 years, GC Referee every 2 years…'
        },
        {
            id: 'lapse_behaviour',
            type: 'single',
            q: "When an accreditation's time is up, what should happen?",
            why: 'We need to know whether the register should act on its own, or always wait for a person.',
            options: [
                { value: 'auto_expire', label: 'Mark it expired automatically, straight away', sub: 'No grace period.' },
                { value: 'grace_period', label: 'Give a grace period first', sub: 'Say how long, in Additional words.' },
                { value: 'coordinator_decides', label: 'Nothing automatic — a coordinator decides case by case', sub: 'More flexible, more manual.' }
            ],
            notesPlaceholder: 'e.g. how long a grace period should be…'
        },
        {
            id: 'reminders',
            type: 'multi',
            q: 'Who should get a reminder before an accreditation lapses?',
            why: 'So nothing lapses by surprise.',
            options: [
                { value: 'the_person', label: 'The coach or referee themselves' },
                { value: 'the_coordinator', label: 'The code coordinator' },
                { value: 'club_secretary', label: 'Their club secretary' }
            ],
            notesPlaceholder: 'How much warning? e.g. 60 days before…'
        },
        {
            id: 'visibility',
            type: 'single',
            q: 'What should other members be able to see about someone’s accreditation?',
            why: 'Blue Card and Working with Children details always stay private to the person and the coordinator — this question is about everything else.',
            options: [
                { value: 'nothing', label: 'Nothing', sub: 'Only the person and coordinators see any of it.' },
                { value: 'accredited_flag', label: 'Just that they’re accredited', sub: 'No level or detail shown.' },
                { value: 'level_club', label: 'Level and club', sub: "e.g. ‘GC Coach Level 2, Wynnum’." },
                { value: 'level_club_expiry', label: 'Level, club, and when it’s due for renewal', sub: 'Full visibility.' }
            ],
            notesPlaceholder: 'Any context that would help…'
        },
        {
            id: 'existing_data',
            type: 'single',
            q: 'We already have 127 coaches on file from your February spreadsheet. What should we do with it?',
            why: 'So real people don’t sit in the new register with no record, or end up duplicated.',
            options: [
                { value: 'import_as_is', label: 'Import all of it now, correct mistakes as we find them', sub: 'Fastest start.' },
                { value: 'import_verified', label: 'Only import the ones you’ve already checked', sub: 'Slower, but you control what goes in.' },
                { value: 'fresh_start', label: 'Start empty, add people as they come up for renewal', sub: 'Clean slate, more manual entry upfront.' }
            ],
            notesPlaceholder: 'Any context that would help…'
        },
        {
            id: 'manual_report',
            type: 'text',
            q: 'Is there a list or report you currently put together by hand?',
            why: 'Describe it and we’ll try to make it a button instead.',
            notesPlaceholder: 'e.g. "Every May I go through the spreadsheet and email anyone due for a refresher…"'
        },
        {
            id: 'dont_lose',
            type: 'text',
            q: 'Is there anything the current way of doing this does that we must not lose when it moves into MyCroquet?',
            why: '',
            notesPlaceholder: 'Optional — anything at all.'
        }
    ];

    window.renderMission = function(tokenRecord) {
        const respondentName = tokenRecord.respondent_name || 'there';
        const firstName = respondentName.split(' ')[0].split(',')[0];
        const draft = tokenRecord.draft_payload || null;

        // answers[id] = { single: value|null, multi: Set, notes: string }
        const answers = {};
        QUESTIONS.forEach(function(qDef) {
            answers[qDef.id] = { single: null, multi: new Set(), notes: '' };
        });

        // Restore from draft
        if (draft && Array.isArray(draft.answers)) {
            draft.answers.forEach(function(entry) {
                if (!entry || !answers[entry.id]) return;
                if (entry.single !== undefined) answers[entry.id].single = entry.single;
                if (Array.isArray(entry.multi)) answers[entry.id].multi = new Set(entry.multi);
                if (entry.notes) answers[entry.id].notes = entry.notes;
            });
        }

        function isAnswered(qDef) {
            const a = answers[qDef.id];
            if (qDef.type === 'text') return true; // optional
            if (qDef.type === 'single') return a.single !== null || a.notes.trim().length > 0;
            if (qDef.type === 'multi') return a.multi.size > 0 || a.notes.trim().length > 0;
            return true;
        }

        function updateValidationState() {
            return QUESTIONS.filter(function(qDef) { return !isAnswered(qDef); });
        }

        var autosave = null;

        function buildPayload() {
            var out = QUESTIONS.map(function(qDef) {
                return {
                    id: qDef.id,
                    single: answers[qDef.id].single,
                    multi: Array.from(answers[qDef.id].multi),
                    notes: answers[qDef.id].notes || ''
                };
            });
            return { answers: out };
        }

        // ---- Build DOM ----
        const app = document.getElementById('app');
        const container = document.createElement('div');
        container.className = 'container';

        const opener = document.createElement('div');
        opener.className = 'opener';
        opener.innerHTML =
            '<p>Hi ' + firstName + ' — Penny asked you to work with us on a system for keeping Qld GC Referee records, and you’ve been asking since April for coaches to be able to update their own accreditation too.</p>' +
            '<p><strong>We’ve already built a working start</strong> for a coaching and refereeing register in MyCroquet — it just needs shaping around what you actually want before we finish it and turn it on.</p>' +
            '<p>Eleven questions below, most one click. Pick an answer where one fits, or use <em>Additional words</em> to add to it or say something different — whichever gets us the real answer.</p>' +
            '<p class="opener-note"><span class="opener-note-icon" aria-hidden="true">✎</span> Your answers save automatically as you go. Close the tab and come back any time — the link picks up where you left off until you press <em>Send my answers</em>.</p>';
        container.appendChild(opener);

        const hr0 = document.createElement('hr');
        hr0.className = 'section-divider';
        container.appendChild(hr0);

        const grid = document.createElement('div');
        grid.className = 'cards-grid questions-grid';

        function buildQuestionCard(qDef, index) {
            const a = answers[qDef.id];
            const card = document.createElement('div');
            card.className = 'card question-card';
            card.dataset.key = qDef.id;
            card.setAttribute('role', 'group');
            card.setAttribute('aria-label', qDef.q);

            const numEl = document.createElement('div');
            numEl.className = 'q-number';
            numEl.textContent = 'Q' + (index + 1);
            card.appendChild(numEl);

            const nameEl = document.createElement('div');
            nameEl.className = 'card-name';
            nameEl.textContent = qDef.q;
            card.appendChild(nameEl);

            if (qDef.why) {
                const whyEl = document.createElement('div');
                whyEl.className = 'q-why';
                whyEl.textContent = qDef.why;
                card.appendChild(whyEl);
            }

            if (qDef.type === 'single' || qDef.type === 'multi') {
                const btnRow = document.createElement('div');
                btnRow.className = 'answer-buttons opt-buttons';

                qDef.options.forEach(function(opt) {
                    const b = document.createElement('button');
                    b.className = 'btn-answer btn-opt';
                    b.dataset.value = opt.value;
                    b.setAttribute('type', 'button');

                    const labelSpan = document.createElement('span');
                    labelSpan.className = 'btn-opt-label';
                    labelSpan.textContent = opt.label;
                    b.appendChild(labelSpan);

                    if (opt.sub) {
                        const subSpan = document.createElement('span');
                        subSpan.className = 'btn-opt-sub';
                        subSpan.textContent = opt.sub;
                        b.appendChild(subSpan);
                    }

                    // Restore selection
                    if (qDef.type === 'single' && a.single === opt.value) {
                        b.classList.add('selected');
                    }
                    if (qDef.type === 'multi' && a.multi.has(opt.value)) {
                        b.classList.add('selected');
                    }

                    b.addEventListener('click', function() {
                        if (qDef.type === 'single') {
                            if (a.single === opt.value) {
                                // click again clears
                                a.single = null;
                                b.classList.remove('selected');
                            } else {
                                btnRow.querySelectorAll('.btn-opt').forEach(function(x) {
                                    x.classList.remove('selected');
                                });
                                a.single = opt.value;
                                b.classList.add('selected');
                            }
                        } else {
                            if (a.multi.has(opt.value)) {
                                a.multi.delete(opt.value);
                                b.classList.remove('selected');
                            } else {
                                a.multi.add(opt.value);
                                b.classList.add('selected');
                            }
                        }

                        if (isAnswered(qDef)) {
                            card.classList.add('answered');
                            card.classList.remove('missing');
                        } else {
                            card.classList.remove('answered');
                        }

                        updateValidationState();
                        if (autosave) autosave.save();
                    });

                    btnRow.appendChild(b);
                });

                card.appendChild(btnRow);
            }

            // Additional words / free-text box — always present, per ask-wade convention.
            const notesArea = document.createElement('div');
            notesArea.className = 'notes-area visible';
            const notesLabel = document.createElement('label');
            notesLabel.style.cssText = 'display:block;font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.3rem;';
            notesLabel.textContent = (qDef.type === 'text') ? 'Your answer:' : 'Additional words:';
            const notesTA = document.createElement('textarea');
            notesTA.placeholder = qDef.notesPlaceholder || 'Any context that would help…';
            notesTA.setAttribute('aria-label', notesLabel.textContent + ' ' + qDef.q);
            notesTA.value = a.notes || '';
            notesTA.addEventListener('input', function() {
                a.notes = notesTA.value;
                if (isAnswered(qDef)) {
                    card.classList.add('answered');
                    card.classList.remove('missing');
                }
                if (autosave) autosave.save();
            });
            notesArea.appendChild(notesLabel);
            notesArea.appendChild(notesTA);
            card.appendChild(notesArea);

            if (isAnswered(qDef)) card.classList.add('answered');

            return card;
        }

        QUESTIONS.forEach(function(qDef, i) {
            grid.appendChild(buildQuestionCard(qDef, i));
        });

        container.appendChild(grid);

        // ---- Validation error ----
        const validationError = document.createElement('div');
        validationError.className = 'validation-error';
        validationError.id = 'validation-error';
        container.appendChild(validationError);

        // ---- Submit ----
        const submitWrap = document.createElement('div');
        submitWrap.className = 'submit-wrap';

        const draftSaved = document.createElement('span');
        draftSaved.id = 'draft-saved-indicator';
        draftSaved.className = 'draft-saved-indicator';
        draftSaved.textContent = '• Draft saved';
        submitWrap.appendChild(draftSaved);

        const submitBtn = document.createElement('button');
        submitBtn.id = 'submit-btn';
        submitBtn.className = 'btn-submit';
        submitBtn.setAttribute('type', 'button');
        submitBtn.textContent = 'Send my answers';

        const errorMsg = document.createElement('div');
        errorMsg.className = 'error-message';
        errorMsg.id = 'error-message';
        errorMsg.innerHTML = 'Something went wrong — please let us know at <a href="mailto:hello@croquetclaude.com">hello@croquetclaude.com</a>.';

        submitBtn.addEventListener('click', async function() {
            const unanswered = updateValidationState();

            grid.querySelectorAll('.question-card').forEach(function(card) {
                const k = card.dataset.key;
                const stillMissing = unanswered.some(function(q) { return q.id === k; });
                if (stillMissing) {
                    card.classList.add('missing');
                } else {
                    card.classList.remove('missing');
                }
            });

            if (unanswered.length > 0) {
                const ve = document.getElementById('validation-error');
                ve.textContent = unanswered.length === 1
                    ? 'One question still needs an answer — it’s highlighted above.'
                    : unanswered.length + ' questions still need answers — they’re highlighted above.';
                ve.classList.add('visible');
                const firstMissing = document.querySelector('.question-card.missing');
                if (firstMissing) {
                    firstMissing.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            const ve = document.getElementById('validation-error');
            ve.classList.remove('visible');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Sending…';

            const responsePayload = buildPayload();

            const ok = await window.submitMission(tokenRecord, responsePayload, respondentName, null, {
                thankyouNote: 'I’ll match your answers up against what’s already built and let you know when the coaching and refereeing register is ready to look at.'
            });

            if (!ok) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send my answers';
                const em = document.getElementById('error-message');
                em.classList.add('visible');
            }
        });

        submitWrap.appendChild(submitBtn);
        submitWrap.appendChild(errorMsg);
        container.appendChild(submitWrap);

        // ---- Mount ----
        app.innerHTML = '';
        app.appendChild(container);

        // ---- Autosave ----
        autosave = window.createAutosave(tokenRecord, buildPayload);

        if (draft && Array.isArray(draft.answers)) {
            window.showDraftRestoredNotice(container, tokenRecord.updated);
        }
    };

    // ---- Boot ----
    document.addEventListener('DOMContentLoaded', function() {
        window.initMission();
    });
    </script>
</body>
</html>
